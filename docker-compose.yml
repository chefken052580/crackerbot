# docker-compose.yml
# Version: v2025-07-30-05
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-crackerbot}
    volumes:
      - redis-data:/data
    networks:
      - crackerbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-crackerbot}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  websocket_server:
    build:
      context: ./ai_coders/websocket_server
      dockerfile: Dockerfile
    container_name: websocket_server
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crackerbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot_lead:
    build:
      context: ./ai_coders/bot_lead
      dockerfile: Dockerfile
    container_name: bot_lead
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
      - WEBSOCKET_URL=ws://websocket_server:5002
      - SERVER_HOST=websocket_server
      - WEBSOCKET_PORT=5002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-crackerbot}
      - REDIS_DB=0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_key_here}
      - LOG_DIR=/bot_lead/logs
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
      websocket_server:
        condition: service_healthy
    networks:
      - crackerbot-network
    volumes:
      - bot_lead_logs:/bot_lead/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot_backend:
    build:
      context: ./ai_coders/bot_backend
      dockerfile: Dockerfile
    container_name: bot_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
      - WEBSOCKET_URL=ws://websocket_server:5002
      - BACKEND_URL=http://bot_backend:5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-crackerbot}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_key_here}
      - LOG_DIR=/bot_backend/logs
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
      websocket_server:
        condition: service_healthy
    networks:
      - crackerbot-network
    volumes:
      - bot_backend_logs:/bot_backend/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot_frontend:
    build:
      context: ./ai_coders/bot_frontend
      dockerfile: Dockerfile
    container_name: bot_frontend
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - REACT_APP_WEBSOCKET_URL=${REACT_APP_WEBSOCKET_URL:-ws://localhost:5002}
    depends_on:
      websocket_server:
        condition: service_healthy
      bot_lead:
        condition: service_healthy
    networks:
      - crackerbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 20s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-your_actual_ngrok_token}
    command: ["start", "--all", "--config", "/etc/ngrok/ngrok.yml"]
    ports:
      - "4040:4040"
    depends_on:
      - bot_frontend
      - websocket_server
    volumes:
      - ./ngrok.yml:/etc/ngrok/ngrok.yml
    networks:
      - crackerbot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4040/api/tunnels"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  crackerbot-network:
    driver: bridge

volumes:
  redis-data:
  bot_lead_logs:
  bot_backend_logs: