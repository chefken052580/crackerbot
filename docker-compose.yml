version: '3.8'
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-crackerbot}
    volumes:
      - redis-data:/data
    networks:
      - crackerbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  websocket_server:
    build:
      context: ./ai_coders/websocket_server
      dockerfile: Dockerfile
    container_name: websocket_server
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - CORS_ORIGIN=https://visually-sterling-spider.ngrok-free.app
      - NODE_ENV=development  # Added for nodemon
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - crackerbot-network
    volumes:
      - ./ai_coders/websocket_server/src:/usr/src/app/src  # Mount src only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot_lead:
    build:
      context: ./ai_coders/bot_lead
      dockerfile: Dockerfile
    container_name: bot_lead
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - CORS_ORIGIN=*
      - WEBSOCKET_URL=ws://websocket_server:5002
      - SERVER_HOST=websocket_server
      - WEBSOCKET_PORT=5002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-crackerbot}
      - REDIS_DB=0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_key_here}
      - LOG_DIR=/bot_lead/logs
      - NODE_ENV=development  # Added for nodemon
    depends_on:
      redis:
        condition: service_healthy
      websocket_server:
        condition: service_healthy
    networks:
      - crackerbot-network
    volumes:
      - ./ai_coders/bot_lead/src:/usr/src/app/src  # Refined to src only
      - bot_lead_logs:/bot_lead/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot_backend:
    build:
      context: ./ai_coders/bot_backend
      dockerfile: Dockerfile
    container_name: bot_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CORS_ORIGIN=*
      - WEBSOCKET_URL=ws://websocket_server:5002
      - BACKEND_URL=http://bot_backend:5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-crackerbot}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_key_here}
      - LOG_DIR=/bot_backend/logs
      - NODE_ENV=development  # Added for nodemon
    depends_on:
      redis:
        condition: service_healthy
      websocket_server:
        condition: service_healthy
    networks:
      - crackerbot-network
    volumes:
      - ./ai_coders/bot_backend/src:/usr/src/app/src  # Refined to src only
      - bot_backend_logs:/bot_backend/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bot_frontend:
    build:
      context: ./ai_coders/bot_frontend
      dockerfile: Dockerfile
      args:
        - WEBSOCKET_SERVER_HOST=websocket_server
    container_name: bot_frontend
    ports:
      - "8080:80"
    environment:
      - WEBSOCKET_SERVER_HOST=websocket_server
      - NODE_ENV=development
    depends_on:
      websocket_server:
        condition: service_healthy
      bot_lead:
        condition: service_started
    networks:
      - crackerbot-network
    volumes:
      - ./ai_coders/bot_frontend/src:/usr/src/app/src  # Added for HMR
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    environment:
      - NGROK_AUTHTOKEN=2pg1fl3g1wDInoW9OJkujqyv0Ro_4NBkBhsL3NSVbK249kRL7
    command: ["start", "--all", "--config", "/etc/ngrok.yml", "--log=stdout"]
    ports:
      - "4040:4040"
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    depends_on:
      - websocket_server
      - bot_frontend
    networks:
      - crackerbot-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  crackerbot-network:
    driver: bridge

volumes:
  redis-data:
  bot_lead_logs:
  bot_backend_logs: