server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html index.htm;

  location / {
    try_files $uri $uri/ /index.html;
    add_header Content-Security-Policy "
      default-src 'self' https://*.ngrok-free.app;
      script-src 'self' 'unsafe-eval' 'unsafe-inline' https://*.ngrok-free.app;
      style-src 'self' 'unsafe-inline' https://*.ngrok-free.app;
      connect-src 'self' wss://*.ngrok-free.app;
      img-src 'self' data: https://*.ngrok-free.app;
      font-src 'self' https://*.ngrok-free.app;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " always;
    add_header X-CSP-Debug "Nginx CSP Set" always;
    access_log /var/log/nginx/access.log main;
  }

  location /socket.io/ {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://websocket_server:5002/socket.io/;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location /api/ {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_pass http://bot_backend:5000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000";
  }

  location /health {
    return 200 "bot_frontend is healthy";
    add_header Content-Type text/plain;
  }

  error_page 404 /index.html;
  error_log /var/log/nginx/error.log warn;
}